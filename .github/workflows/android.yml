name: Build Hikari AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ls -la
          test -f HikariAI-Android-Project.zip || { echo "Архив не найден в корне репозитория"; exit 1; }
          mkdir -p project
          unzip -o HikariAI-Android-Project.zip -d project
          find project -maxdepth 2 -name "build.gradle*"
          cp -R project/. .

      - name: Fix JVM target
        run: |
          find . -name "build.gradle*" -type f -print
          find . -name "build.gradle*" -type f -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/JVM_1_8/JVM_17/g' \
            -e "s/jvmTarget = ['\"]1\.8['\"]/jvmTarget = \"17\"/g" \
            -e "s/jvmTarget\.set(['\"]1\.8['\"])/jvmTarget.set(\"17\")/g" \
            -e "s/jvmTarget(['\"]1\.8['\"])/jvmTarget(\"17\")/g" \
            -e "s/sourceCompatibility = ['\"]1\.8['\"]/sourceCompatibility = \"17\"/g" \
            -e "s/targetCompatibility = ['\"]1\.8['\"]/targetCompatibility = \"17\"/g" \
            -e "s/compatibility = ['\"]1\.8['\"]/compatibility = \"17\"/g" \
            {} +
          echo "--- Строки с 1.8 после правки ---"
          grep -rn "1\.8" --include="build.gradle*" . || echo "Настроек с 1.8 не осталось"
          if [ -f gradle.properties ]; then
            grep -q "kotlin.jvm.target.validation.mode" gradle.properties || \
              echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          else
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi

      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            "$(dirname "$GRADLEW")/gradlew" -p "$(dirname "$GRADLEW")" assembleDebug --stacktrace
          else
            echo "gradlew не найден, использую системный Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hikari-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
