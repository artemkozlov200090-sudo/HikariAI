name: Build Hikari AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          unzip -o HikariAI-Android-Project.zip -d unpacked
          echo "=== Структура папок ==="
          find unpacked -maxdepth 3

      - name: Create Constants.kt
        run: |
          mkdir -p unpacked/app/src/main/java/ai/hikari/app
          cat > unpacked/app/src/main/java/ai/hikari/app/Constants.kt <<EOF
          package ai.hikari.app

          object Constants {
              const val BASE_URL = "https://openrouter.ai/api/v1"
              const val API_KEY = "\${{ secrets.OPENROUTER_API_KEY }}"
          }
          EOF
          echo "=== Содержимое Constants.kt ==="
          cat unpacked/app/src/main/java/ai/hikari/app/Constants.kt

      # Чиним несовпадение JVM-версий: заменяем 1.8 на 17 в файлах сборки
      - name: Fix JVM target (1.8 -> 17)
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g; s/"1\.8"/"17"/g; s/1\.8/17/g' unpacked/app/build.gradle.kts unpacked/build.gradle.kts
          echo "=== app/build.gradle.kts после правки ==="
          cat unpacked/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd unpacked
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikari-ai-apk
          path: unpacked/app/build/outputs/apk/debug/*.apk
