name: Build Hikari AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          unzip -o HikariAI-Android-Project.zip -d unpacked
          echo "=== Файлы в распакованной папке ==="
          find unpacked -maxdepth 3

      - name: Create Constants.kt with API Key
        run: |
          mkdir -p unpacked/app/src/main/java/ai/hikari/app
          cat > unpacked/app/src/main/java/ai/hikari/app/Constants.kt <<EOF
          package ai.hikari.app

          object Constants {
              const val BASE_URL = "https://openrouter.ai/api/v1"
              const val API_KEY = "\${{ secrets.OPENROUTER_API_KEY }}"
          }
          EOF
          cat unpacked/app/src/main/java/ai/hikari/app/Constants.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Java & Gradle versions
        run: |
          java -version
          gradle --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd unpacked
          # Если в корне есть settings.gradle.kts — сборка пойдёт оттуда
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-ai-apk
          path: unpacked/app/build/outputs/apk/debug/*.apk
