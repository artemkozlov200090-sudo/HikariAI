name: Build Hikari AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ls -la
          test -f HikariAI-Android-Project.zip || { echo "Архив не найден в корне репозитория"; exit 1; }
          mkdir -p project
          unzip -o HikariAI-Android-Project.zip -d project
          find project -maxdepth 2 -name "build.gradle*" -o -maxdepth 2 -name "settings.gradle*"
          cp -R project/. .

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hikari-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
