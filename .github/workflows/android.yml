name: Build Hikari AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Распаковываем ZIP с исходниками проекта
      - name: Unzip project archive
        run: |
          ls -la
          # распаковываем архив в корень репозитория
          unzip -o HikariAI-Android-Project.zip -d .
          # если внутри архива была своя папка — поднимаем её содержимое выше
          inner=$(find . -maxdepth 2 -type d -name app | head -n 1)
          echo "Найдена папка app: $inner"

      # 3. Создаём Constants.kt с ключом OpenRouter
      - name: Create Constants.kt with API Key
        run: |
          # находим папку с исходниками, куда бы она ни легла после распаковки
          pkg_dir=$(dirname $(find . -type d -path '*/java/*' | head -n 1))
          echo "Пакет: $pkg_dir"
          cat > "$pkg_dir/Constants.kt" <<EOF
          object Constants {
              const val BASE_URL = "https://openrouter.ai/api/v1"
              const val API_KEY = "${{ secrets.OPENROUTER_API_KEY }}"
          }
          EOF
          cat "$pkg_dir/Constants.kt"

      # 4. Настраиваем Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Даём право gradlew запускаться
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Собираем APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Сохраняем APK как артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-ai-apk
          path: app/build/outputs/apk/debug/*.apk
