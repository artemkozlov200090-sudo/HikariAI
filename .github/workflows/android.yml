name: Build Hikari AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          unzip -o HikariAI-Android-Project.zip -d unpacked
          echo "=== Структура папок ==="
          find unpacked -maxdepth 3

      - name: Create Constants.kt
        run: |
          mkdir -p unpacked/app/src/main/java/ai/hikari/app
          cat > unpacked/app/src/main/java/ai/hikari/app/Constants.kt <<EOF
          package ai.hikari.app

          object Constants {
              const val BASE_URL = "https://openrouter.ai/api/v1"
              const val API_KEY = "${{ secrets.OPENROUTER_API_KEY }}"
          }
          EOF
          echo "Constants.kt создан"

      - name: Force JVM target 17
        run: |
          cat >> unpacked/app/build.gradle.kts <<'EOL'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOL

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd unpacked
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikari-ai-apk
          path: unpacked/app/build/outputs/apk/debug/*.apk
